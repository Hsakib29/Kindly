<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kindly</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 240px;
        margin: 0;
        padding: 12px 14px;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: var(--text, CanvasText);
        background: var(--bg, Canvas);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
      }
      #popup-rows > .row:not(:first-child) {
        border-top: 1px solid var(--divider, color-mix(in srgb, CanvasText 15%, transparent));
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .usage {
        color: var(--text-secondary, color-mix(in srgb, CanvasText 65%, transparent));
        font-size: 12px;
      }
      .pfoot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
        font-size: 12px;
        color: var(--text-secondary, color-mix(in srgb, CanvasText 65%, transparent));
      }
      .pfoot a {
        color: var(--accent, LinkText);
        text-decoration: underline;
      }
      #popup-rows {
        background: var(--surface, Canvas);
        border: 1px solid var(--border, color-mix(in srgb, CanvasText 20%, transparent));
        border-radius: 10px;
        padding: 8px 10px;
      }
      .site {
        font-size: 11px;
        color: var(--text-secondary, color-mix(in srgb, CanvasText 55%, transparent));
        margin: 0 0 4px 23px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      :root[data-theme='light'] {
        --bg: #f5f7ff;
        --surface: #ffffff;
        --text: #202b50;
        --accent: #5269d8;
        --border: #dce3ff;
        --text-secondary: #4c5683;
        --control-border: #8a93c4;
        --accent-tint: #e3e9ff;
        --text-on-accent: #ffffff;
        --danger: #b3261e;
        --shadow: rgba(32, 43, 80, 0.22);
        --divider: #dce3ff;
        --focus-ring: #5269d8;
      }
      :root[data-theme='dark'] {
        --bg: #0d1224;
        --surface: #171f3a;
        --text: #f4f6ff;
        --accent: #afc0ff;
        --border: #303b61;
        --text-secondary: #a9b4d8;
        --control-border: #5a6690;
        --accent-tint: #26314f;
        --text-on-accent: #0d1224;
        --danger: #ffb4ab;
        --shadow: rgba(0, 0, 0, 0.55);
        --divider: #303b61;
        --focus-ring: #afc0ff;
      }
    </style>
  </head>
  <body>
    <div
      id="pattern-band"
      hidden
      style="
        height: 32px;
        margin: -12px -14px 10px;
        border-bottom: 1px solid var(--divider);
        background-color: var(--sage-tint, var(--bg));
        background-repeat: repeat;
      "
    ></div>
    <h1 id="app-title">Kindly</h1>
    <div id="popup-rows">
      <div class="row">
        <label>
          <input type="checkbox" id="site-toggle" />
          <span>Enabled on this site</span>
        </label>
      </div>
      <div class="site" id="site-name"></div>
      <div class="row">
        <label>
          <input type="checkbox" id="page-context-site" />
          <span>Page context for this site</span>
        </label>
      </div>
      <div class="site" id="page-context-note" hidden>
        Turn on page context in Settings to use this.
      </div>
    </div>
    <div class="pfoot">
      <span class="usage" id="usage">Rewrites today: —</span
      ><a href="#" id="open-options">Settings</a>
    </div>
    <script type="module" src="./src/popup/popup.ts"></script>
  </body>
</html>
