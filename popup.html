<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kindly</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 240px;
        margin: 0;
        padding: 12px 14px;
        font: 13px/1.4 system-ui, sans-serif;
        color: var(--text, CanvasText);
        background: var(--bg, Canvas);
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
      }
      .row + .row { border-top: 1px solid var(--divider, color-mix(in srgb, CanvasText 15%, transparent)); }
      label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .usage { color: var(--text-secondary, color-mix(in srgb, CanvasText 65%, transparent)); font-size: 12px; }
      .links { display: flex; gap: 10px; margin-top: 10px; }
      .links a { color: var(--accent, LinkText); font-size: 12px; }
      .site { font-size: 11px; color: var(--text-secondary, color-mix(in srgb, CanvasText 55%, transparent));
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
          :root[data-theme='light'] {
        --bg:#F5F7FF; --surface:#FFFFFF; --text:#202B50; --accent:#5269D8; --border:#DCE3FF;
        --text-secondary:#4C5683; --control-border:#8A93C4; --accent-tint:#E3E9FF;
        --text-on-accent:#FFFFFF; --danger:#B3261E; --shadow:rgba(32,43,80,0.22);
        --divider:#DCE3FF; --focus-ring:#5269D8;
      }
      :root[data-theme='dark'] {
        --bg:#0D1224; --surface:#171F3A; --text:#F4F6FF; --accent:#AFC0FF; --border:#303B61;
        --text-secondary:#A9B4D8; --control-border:#5A6690; --accent-tint:#26314F;
        --text-on-accent:#0D1224; --danger:#FFB4AB; --shadow:rgba(0,0,0,0.55);
        --divider:#303B61; --focus-ring:#AFC0FF;
      }
    </style>
  </head>
  <body>
    <h1 id="app-title">Kindly</h1>
    <div class="row">
      <label>
        <input type="checkbox" id="site-toggle" />
        <span>Enabled on this site</span>
      </label>
    </div>
    <div class="site" id="site-name"></div>
    <div class="row usage" id="usage">Rewrites today: —</div>
    <div class="links">
      <a href="#" id="open-options">Settings</a>
    </div>
    <script type="module" src="./src/popup/popup.ts"></script>
  </body>
</html>
