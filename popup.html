<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kindly</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 240px;
        margin: 0;
        padding: 12px 14px;
        font: 13px/1.4 system-ui, sans-serif;
        color: CanvasText;
        background: Canvas;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
      }
      .row + .row { border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
      label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .usage { color: color-mix(in srgb, CanvasText 65%, transparent); font-size: 12px; }
      .links { display: flex; gap: 10px; margin-top: 10px; }
      .links a { color: LinkText; font-size: 12px; }
      .site { font-size: 11px; color: color-mix(in srgb, CanvasText 55%, transparent);
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <h1 id="app-title">Kindly</h1>
    <div class="row">
      <label>
        <input type="checkbox" id="site-toggle" />
        <span>Enabled on this site</span>
      </label>
    </div>
    <div class="site" id="site-name"></div>
    <div class="row usage" id="usage">Rewrites today: —</div>
    <div class="links">
      <a href="#" id="open-options">Settings</a>
    </div>
    <script type="module" src="./src/popup/popup.ts"></script>
  </body>
</html>
